<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d"><title id="t">Three separate measurement questions</title><desc id="d">Calibration status, the measurement result and the acceptance decision are linked but different. No numerical tolerance or uncertainty is shown.</desc><rect width="1200" height="900" fill="#edf1ec"/><text x="65" y="100" font-family="Arial,sans-serif" font-size="30" letter-spacing="4" fill="#8c5a40">SOURCE RATING / FIELD NOTES</text><text x="65" y="198" font-family="Georgia,serif" font-size="62" fill="#193a3e">What does the number prove?</text><g font-family="Arial,sans-serif" fill="#193a3e"><text x="70" y="330" font-size="48" font-weight="700">CALIBRATION</text><text x="70" y="506" font-size="48" font-weight="700">MEASUREMENT</text><text x="70" y="682" font-size="48" font-weight="700">ACCEPTANCE</text></g><g stroke="#193a3e" stroke-width="6"><rect x="760" y="260" width="220" height="105" rx="7" fill="#d4c4a6"/><path d="M790 310h160m-130-20v40m70-40v40"/><rect x="760" y="436" width="220" height="105" rx="7" fill="#c0d4cd"/><path d="M790 490h160m-120-23v46m80-46v46"/><rect x="760" y="612" width="220" height="105" rx="7" fill="#193a3e"/></g><text x="870" y="681" text-anchor="middle" font-family="Georgia,serif" font-size="65" fill="#edf1ec">?</text><g stroke="#ac734e" stroke-width="6" fill="none"><path d="M870 376v40m-12-12 12 12 12-12M870 552v40m-12-12 12 12 12-12"/></g><rect y="796" width="1200" height="104" fill="#193a3e"/><text x="65" y="860" font-family="Arial,sans-serif" font-size="38" fill="#edf1ec">A sticker is a starting point, not a verdict.</text></svg>