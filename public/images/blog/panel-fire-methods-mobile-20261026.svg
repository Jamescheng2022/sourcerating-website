<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1190" viewBox="0 0 720 1190" role="img" aria-labelledby="title desc">
<title id="title">The difference between ASTM E84 and EN 13501-1</title><desc id="desc">Two separate evidence systems. ASTM E84 addresses surface-burning indices; EN 13501-1 classifies reaction-to-fire, including smoke and droplets. No direct conversion is implied.</desc>
<defs><linearGradient id="steel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#AFC2C8"/><stop offset=".31" stop-color="#F4F6F4"/><stop offset=".67" stop-color="#8298A0"/><stop offset="1" stop-color="#536A74"/></linearGradient>
<linearGradient id="darkmetal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#334953"/><stop offset=".5" stop-color="#152A33"/><stop offset="1" stop-color="#445862"/></linearGradient>
<linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E9D7BC"/><stop offset="1" stop-color="#B8A68D"/></linearGradient>
<linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E5EAE7"/></linearGradient>
<pattern id="fiber" width="14" height="16" patternUnits="userSpaceOnUse"><path d="M-2 16L16-2 M6 20L20 6" stroke="#9F907D" stroke-width="1" opacity=".3"/></pattern>
<pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse"><path d="M 64 0 L 0 0 0 64" fill="none" stroke="#70838B" stroke-width="1" opacity=".10"/></pattern>
<filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="13" stdDeviation="17" flood-color="#12262D" flood-opacity=".14"/></filter>
</defs>
<rect x="0" y="0" width="720" height="1190" rx="0" fill="#F5F3EE" stroke="none" stroke-width="1"/><rect x="0" y="0" width="720" height="1190" rx="0" fill="url(#grid)" stroke="none" stroke-width="1"/>
<path d="M 0 0 H 720 V 11 H 0Z" fill="#B0744D"/>
<text x="52" y="69" fill="#B0744D" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" letter-spacing="3">FIGURE 01 / DIFFERENT METHODS</text><text x="52" y="131" fill="#172B35" font-family="Arial,Helvetica,sans-serif" font-size="37" font-weight="700" >A label is not a translation.</text><text x="52" y="176" fill="#586974" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" >Two legitimate reports may answer different questions.</text><g filter="url(#shadow)"><rect x="55" y="231" width="610" height="360" rx="18" fill="url(#paper)" stroke="#D2DBD8" stroke-width="2"/></g><rect x="55" y="231" width="10" height="360" rx="4" fill="#B0744D" stroke="none" stroke-width="1"/><text x="85" y="285" fill="#B0744D" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" letter-spacing="2">SURFACE-BURNING METHOD</text><text x="85" y="335" fill="#172B35" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="700" >ASTM E84</text><line x1="85" y1="357" x2="635" y2="357" stroke="#CAD3D2" stroke-width="2" /><text x="85" y="403" fill="#354A55" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="500" >Flame-spread index</text><line x1="85" y1="419" x2="635" y2="419" stroke="#CCD5D2" stroke-width="2" /><text x="85" y="466" fill="#354A55" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="500" >Smoke-developed index</text><line x1="85" y1="480" x2="635" y2="480" stroke="#CCD5D2" stroke-width="2" /><text x="85" y="537" fill="#7C8580" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="500" >Defined test conditions</text><rect x="305" y="603" width="110" height="85" rx="46" fill="#F5F3EE" stroke="#CAD2D0" stroke-width="2"/><text x="323" y="667" fill="#B0744D" font-family="Arial,Helvetica,sans-serif" font-size="74" font-weight="700" >≠</text><g filter="url(#shadow)"><rect x="55" y="694" width="610" height="360" rx="18" fill="url(#paper)" stroke="#D2DBD8" stroke-width="2"/></g><rect x="55" y="694" width="10" height="360" rx="4" fill="#B0744D" stroke="none" stroke-width="1"/><text x="85" y="748" fill="#B0744D" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" letter-spacing="2">CLASSIFICATION FRAMEWORK</text><text x="85" y="798" fill="#172B35" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="700" >EN 13501-1</text><line x1="85" y1="820" x2="635" y2="820" stroke="#CAD3D2" stroke-width="2" /><text x="85" y="866" fill="#354A55" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="500" >Reaction-to-fire class</text><line x1="85" y1="882" x2="635" y2="882" stroke="#CCD5D2" stroke-width="2" /><text x="85" y="929" fill="#354A55" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="500" >Smoke + droplets suffixes</text><line x1="85" y1="943" x2="635" y2="943" stroke="#CCD5D2" stroke-width="2" /><text x="85" y="1000" fill="#7C8580" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="500" >End-use application</text><text x="55" y="1127" fill="#172B35" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" >Do not convert labels.</text>
</svg>