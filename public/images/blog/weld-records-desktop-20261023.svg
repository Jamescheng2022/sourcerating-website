<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 710" width="1200" height="710" role="img"><title>Three records. Three jobs.</title><desc>Original SourceRating editorial illustration; not evidence of any real project, weld or inspection result.</desc><rect x="0" y="0" width="1200" height="710" rx="0" fill="#F4F1E8"/><text x="42" y="48" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#397368">SOURCERATING / EVIDENCE PLATE 02</text><text x="42" y="108" font-family="Arial,Helvetica,sans-serif" font-size="41" font-weight="700" fill="#203D33">Three records. Three jobs.</text><text x="42" y="151" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" fill="#60746A">A procedure is not an inspection result.</text><rect x="49" y="199" width="354" height="421" rx="12" fill="#FFFFFF"/><rect x="49" y="199" width="354" height="10" rx="0" fill="#BE7546"/><text x="75" y="253" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#397368">WPS / METHOD</text><text x="75" y="310" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#203D33">PROCEDURE</text><path d="M75 342 L377 342" stroke="#D1DAD1" stroke-width="2" stroke-linecap="round"/><text x="75" y="393" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#203D33">What process is agreed?</text><text x="75" y="447" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#60746A">Parameters and qualification basis</text><rect x="420" y="199" width="354" height="421" rx="12" fill="#FFFFFF"/><rect x="420" y="199" width="354" height="10" rx="0" fill="#397368"/><text x="446" y="253" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#397368">WELDER</text><text x="446" y="310" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#203D33">PERSONNEL</text><path d="M446 342 L748 342" stroke="#D1DAD1" stroke-width="2" stroke-linecap="round"/><text x="446" y="393" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#203D33">Who may perform it?</text><text x="446" y="447" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#60746A">Applicable qualification evidence</text><rect x="791" y="199" width="354" height="421" rx="12" fill="#FFFFFF"/><rect x="791" y="199" width="354" height="10" rx="0" fill="#203D33"/><text x="817" y="253" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#397368">REPORT</text><text x="817" y="310" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#203D33">EXAMINATION</text><path d="M817 342 L1119 342" stroke="#D1DAD1" stroke-width="2" stroke-linecap="round"/><text x="817" y="393" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#203D33">What was checked?</text><text x="817" y="447" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#60746A">Named weld, method, outcome</text><text x="42" y="681" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#60746A">ORIGINAL EXPLANATORY ART  /  NOT A PROJECT RECORD</text></svg>