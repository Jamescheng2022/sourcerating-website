<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d"><title id="t">The grade label and the carbon question</title><desc id="d">Conceptual alloy-family match is shown separately from carbon verification. There are no actual measurements or numerical chemical limits.</desc><rect width="1200" height="900" fill="#f4f0e7"/><text x="65" y="100" font-family="Arial,sans-serif" font-size="30" letter-spacing="4" fill="#95613e">SOURCE RATING / FIELD NOTES</text><text x="65" y="198" font-family="Georgia,serif" font-size="64" fill="#193a3e">Who verified the carbon?</text><rect x="110" y="306" width="410" height="326" rx="28" fill="#193a3e"/><rect x="152" y="353" width="326" height="170" rx="8" fill="#d8e8dc"/><text x="315" y="466" text-anchor="middle" font-family="Arial,sans-serif" font-size="95" font-weight="700" fill="#193a3e">316</text><circle cx="315" cy="580" r="22" fill="#b57e50"/><circle cx="865" cy="465" r="155" fill="#dcc8a9"/><text x="865" y="500" text-anchor="middle" font-family="Georgia,serif" font-size="112" fill="#193a3e">C?</text><g font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#193a3e"><text x="315" y="710" text-anchor="middle">ALLOY MATCH</text><text x="865" y="710" text-anchor="middle">CARBON EVIDENCE</text></g><rect y="796" width="1200" height="104" fill="#193a3e"/><text x="65" y="860" font-family="Arial,sans-serif" font-size="38" fill="#f4f0e7">A displayed match is not every element.</text></svg>