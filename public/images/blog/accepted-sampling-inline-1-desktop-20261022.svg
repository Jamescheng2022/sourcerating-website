<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc"><title id="title">What is the inspection lot?</title><desc id="desc">SourceRating original conceptual buyer-evidence figure, not a supplier, inspection record, shipment, or prescribed sampling plan.</desc><rect width="1200" height="820" fill="#F8F7F3"/><text x="48" y="57" font-size="21" font-weight="700" fill="#556A75" font-family="Arial,Helvetica,sans-serif">SOURCE RATING / BUYER EVIDENCE</text><text x="48" y="129" font-size="47" font-weight="700" fill="#182D3B" font-family="Arial,Helvetica,sans-serif">What is the inspection lot?</text><text x="48" y="180" font-size="26" font-weight="400" fill="#556A75" font-family="Arial,Helvetica,sans-serif">Define exactly which goods the sampling decision covers.</text><rect x="48" y="270" width="516" height="390" rx="17" fill="#FFFFFF" stroke="#D6DED9" stroke-width="2"/><rect x="603" y="270" width="548" height="390" rx="17" fill="#FFFFFF" stroke="#D6DED9" stroke-width="2"/><text x="76" y="324" font-size="28" font-weight="700" fill="#182D3B" font-family="Arial,Helvetica,sans-serif">ONE SHIPPING ORDER</text><text x="76" y="378" font-size="22" font-weight="400" fill="#556A75" font-family="Arial,Helvetica,sans-serif">Not necessarily one uniform inspection lot</text><text x="630" y="324" font-size="28" font-weight="700" fill="#182D3B" font-family="Arial,Helvetica,sans-serif">DEFINED POPULATIONS</text><text x="630" y="378" font-size="22" font-weight="400" fill="#556A75" font-family="Arial,Helvetica,sans-serif">The plan must identify covered goods</text><rect x="80" y="453" width="143" height="81" rx="17" fill="#D7E8EF" stroke="#D6DED9" stroke-width="2"/><text x="92" y="501" font-size="18" font-weight="700" fill="#182D3B" font-family="Arial,Helvetica,sans-serif">Batch A</text><rect x="243" y="453" width="143" height="81" rx="17" fill="#EDE3D5" stroke="#D6DED9" stroke-width="2"/><text x="255" y="501" font-size="18" font-weight="700" fill="#182D3B" font-family="Arial,Helvetica,sans-serif">Batch B</text><rect x="406" y="453" width="143" height="81" rx="17" fill="#DDEADC" stroke="#D6DED9" stroke-width="2"/><text x="418" y="501" font-size="18" font-weight="700" fill="#182D3B" font-family="Arial,Helvetica,sans-serif">Revision C</text><rect x="636" y="453" width="153" height="81" rx="17" fill="#D7E8EF" stroke="#D6DED9" stroke-width="2"/><text x="647" y="501" font-size="18" font-weight="700" fill="#182D3B" font-family="Arial,Helvetica,sans-serif">Scope 1</text><rect x="806" y="453" width="153" height="81" rx="17" fill="#EDE3D5" stroke="#D6DED9" stroke-width="2"/><text x="817" y="501" font-size="18" font-weight="700" fill="#182D3B" font-family="Arial,Helvetica,sans-serif">Scope 2</text><rect x="976" y="453" width="153" height="81" rx="17" fill="#DDEADC" stroke="#D6DED9" stroke-width="2"/><text x="987" y="501" font-size="18" font-weight="700" fill="#182D3B" font-family="Arial,Helvetica,sans-serif">Hold / clarify</text><text x="60" y="711" font-size="21" font-weight="400" fill="#556A75" font-family="Arial,Helvetica,sans-serif">The responsible quality team defines the actual lot, boundaries and applicable plan.</text><path d="M48 722 H1152" stroke="#D6DED9" stroke-width="2"/><text x="48" y="762" font-size="19" font-weight="400" fill="#556A75" font-family="Arial,Helvetica,sans-serif">Original conceptual figure — not a real inspection, packing record or sampling plan</text></svg>