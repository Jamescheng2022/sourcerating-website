<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1125" width="900" height="1125" role="img" aria-labelledby="title desc"><title id="title">Pass supports lot acceptance, not a zero-defect guarantee</title><desc id="desc">Contrasting what a passing acceptance sampling decision supports with claims it does not prove, without depicting a real inspection result.</desc><rect width="900" height="1125" fill="#f6f2ea"/><path d="M65 70H835" stroke="#b8b4a7" stroke-width="2"/><text x="65" y="118" fill="#a16842" font-size="29" font-family="Arial,Helvetica,sans-serif" font-weight="700" letter-spacing="4">SOURCE RATING / FIELD NOTES</text>
<text x="65" y="208" fill="#17343b" font-size="58" font-family="Georgia,serif">What a PASS</text><text x="65" y="278" fill="#17343b" font-size="58" font-family="Georgia,serif">actually tells you</text>
<path d="M65 322H835" stroke="#bec6b9" stroke-width="2"/>
<rect x="65" y="368" width="770" height="282" rx="12" fill="#e0e9df"/><circle cx="145" cy="443" r="50" fill="#244f4b"/><path d="M123 442l17 16 28-31" stroke="#f3f2e9" stroke-width="11" fill="none" stroke-linecap="round"/>
<text x="225" y="426" fill="#244f4b" font-family="Arial,Helvetica,sans-serif" font-size="39" font-weight="700">SUPPORTED</text><text x="225" y="472" fill="#17343b" font-family="Arial,Helvetica,sans-serif" font-size="36">Lot accepted under an</text><text x="225" y="516" fill="#17343b" font-family="Arial,Helvetica,sans-serif" font-size="36">agreed sampling plan.</text>
<text x="96" y="597" fill="#526961" font-family="Georgia,serif" font-size="34">For the characteristics actually checked</text>
<rect x="65" y="700" width="770" height="286" rx="12" fill="#f3e4dc"/><circle cx="145" cy="778" r="50" fill="#b36e4b"/><path d="M124 756l42 42m0-42-42 42" stroke="#fffaf4" stroke-width="11" stroke-linecap="round"/>
<text x="225" y="756" fill="#a05c3d" font-family="Arial,Helvetica,sans-serif" font-size="39" font-weight="700">NOT PROVEN</text><text x="225" y="811" fill="#17343b" font-family="Arial,Helvetica,sans-serif" font-size="36">Every unit was checked.</text><text x="225" y="858" fill="#17343b" font-family="Arial,Helvetica,sans-serif" font-size="36">No defects remain.</text>
<text x="96" y="936" fill="#7c6354" font-family="Georgia,serif" font-size="34">Do not turn a decision into a warranty.</text>
<rect x="0" y="1063" width="900" height="62" fill="#17343b"/><text x="65" y="1104" fill="#f7f1e7" font-size="27" font-family="Arial,Helvetica,sans-serif">Concept illustration — not an actual inspection report</text></svg>