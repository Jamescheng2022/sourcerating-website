<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d"><title id="t">Does the scope cover the test?</title><desc id="d">A requested test is compared with a defined scope, not with the laboratory brand alone. No accreditation logo or real report is reproduced.</desc><rect width="1200" height="900" fill="#eef2ee"/><text x="65" y="100" font-family="Arial,sans-serif" font-size="30" letter-spacing="4" fill="#986644">SOURCE RATING / FIELD NOTES</text><text x="65" y="198" font-family="Georgia,serif" font-size="64" fill="#1c3b40">Find the matching activity</text><rect x="95" y="310" width="430" height="330" rx="9" fill="#c7d8d0" stroke="#1c3b40" stroke-width="5"/><rect x="675" y="310" width="430" height="330" rx="9" fill="#f7f4e9" stroke="#1c3b40" stroke-width="5"/><g font-family="Arial,sans-serif" fill="#1c3b40" font-weight="700"><text x="310" y="380" text-anchor="middle" font-size="42">YOUR TEST</text><text x="890" y="380" text-anchor="middle" font-size="42">LAB SCOPE</text></g><g stroke="#66827e" stroke-width="11"><path d="M145 447h330m-330 66h330m-330 66h220M725 447h330m-330 66h330m-330 66h220"/></g><path d="M550 511h100m-18-18 18 18-18 18" stroke="#a46a42" stroke-width="9" fill="none"/><rect y="796" width="1200" height="104" fill="#1c3b40"/><text x="65" y="860" font-family="Arial,sans-serif" font-size="38" fill="#eef2ee">Accreditation has a defined scope.</text></svg>