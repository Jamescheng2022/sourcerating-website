<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">The difference between ASTM E84 and EN 13501-1</title><desc id="desc">Two separate evidence systems. ASTM E84 addresses surface-burning indices; EN 13501-1 classifies reaction-to-fire, including smoke and droplets. No direct conversion is implied.</desc>
<defs><linearGradient id="steel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#AFC2C8"/><stop offset=".31" stop-color="#F4F6F4"/><stop offset=".67" stop-color="#8298A0"/><stop offset="1" stop-color="#536A74"/></linearGradient>
<linearGradient id="darkmetal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#334953"/><stop offset=".5" stop-color="#152A33"/><stop offset="1" stop-color="#445862"/></linearGradient>
<linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E9D7BC"/><stop offset="1" stop-color="#B8A68D"/></linearGradient>
<linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E5EAE7"/></linearGradient>
<pattern id="fiber" width="14" height="16" patternUnits="userSpaceOnUse"><path d="M-2 16L16-2 M6 20L20 6" stroke="#9F907D" stroke-width="1" opacity=".3"/></pattern>
<pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse"><path d="M 64 0 L 0 0 0 64" fill="none" stroke="#70838B" stroke-width="1" opacity=".10"/></pattern>
<filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="13" stdDeviation="17" flood-color="#12262D" flood-opacity=".14"/></filter>
</defs>
<rect x="0" y="0" width="1200" height="760" rx="0" fill="#F5F3EE" stroke="none" stroke-width="1"/><rect x="0" y="0" width="1200" height="760" rx="0" fill="url(#grid)" stroke="none" stroke-width="1"/>
<path d="M 0 0 H 1200 V 11 H 0Z" fill="#B0744D"/>
<text x="75" y="72" fill="#B0744D" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" letter-spacing="3">FIGURE 01 / DIFFERENT METHODS</text><text x="75" y="134" fill="#172B35" font-family="Arial,Helvetica,sans-serif" font-size="44" font-weight="700" >A label is not a translation.</text><text x="75" y="179" fill="#586974" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" >Two legitimate reports may answer different questions.</text><g filter="url(#shadow)"><rect x="75" y="224" width="470" height="400" rx="18" fill="url(#paper)" stroke="#D2DBD8" stroke-width="2"/></g><rect x="75" y="224" width="10" height="400" rx="4" fill="#B0744D" stroke="none" stroke-width="1"/><text x="111" y="278" fill="#B0744D" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" letter-spacing="2">SURFACE-BURNING METHOD</text><text x="111" y="328" fill="#172B35" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="700" >ASTM E84</text><line x1="111" y1="350" x2="509" y2="350" stroke="#CAD3D2" stroke-width="2" /><text x="111" y="396" fill="#354A55" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="500" >Flame-spread index</text><line x1="111" y1="412" x2="509" y2="412" stroke="#CCD5D2" stroke-width="2" /><text x="111" y="459" fill="#354A55" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="500" >Smoke-developed index</text><line x1="111" y1="473" x2="509" y2="473" stroke="#CCD5D2" stroke-width="2" /><text x="111" y="530" fill="#7C8580" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="500" >Defined test conditions</text><g filter="url(#shadow)"><rect x="655" y="224" width="470" height="400" rx="18" fill="url(#paper)" stroke="#D2DBD8" stroke-width="2"/></g><rect x="655" y="224" width="10" height="400" rx="4" fill="#B0744D" stroke="none" stroke-width="1"/><text x="691" y="278" fill="#B0744D" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" letter-spacing="2">CLASSIFICATION FRAMEWORK</text><text x="691" y="328" fill="#172B35" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="700" >EN 13501-1</text><line x1="691" y1="350" x2="1089" y2="350" stroke="#CAD3D2" stroke-width="2" /><text x="691" y="396" fill="#354A55" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="500" >Reaction-to-fire class</text><line x1="691" y1="412" x2="1089" y2="412" stroke="#CCD5D2" stroke-width="2" /><text x="691" y="459" fill="#354A55" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="500" >Smoke + droplets suffixes</text><line x1="691" y1="473" x2="1089" y2="473" stroke="#CCD5D2" stroke-width="2" /><text x="691" y="530" fill="#7C8580" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="500" >End-use application</text><rect x="553" y="365" width="94" height="94" rx="48" fill="#F5F3EE" stroke="#CBD3CF" stroke-width="2"/><text x="567" y="432" fill="#B0744D" font-family="Arial,Helvetica,sans-serif" font-size="73" font-weight="700" >≠</text><text x="75" y="683" fill="#172B35" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" >No automatic Class A → B-s1,d0 equivalence.</text>
</svg>