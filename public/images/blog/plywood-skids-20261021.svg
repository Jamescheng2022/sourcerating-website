<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d"><title id="t">Look underneath the plywood crate</title><desc id="d">A conceptual crate separates its walls, supporting skids and additional bracing. The drawing makes no claim about real packing materials or compliance.</desc><rect width="1200" height="900" fill="#f5f1e7"/><text x="65" y="100" font-family="Arial,sans-serif" font-size="30" letter-spacing="4" fill="#8d5a36">SOURCE RATING / FIELD NOTES</text><text x="65" y="198" font-family="Georgia,serif" font-size="64" fill="#193a3e">Look beyond the crate walls</text><path d="M380 325l370-55 170 115-380 60z" fill="#d3bd94" stroke="#193a3e" stroke-width="5"/><path d="M380 325v270l160 104V445z" fill="#b69a70" stroke="#193a3e" stroke-width="5"/><path d="M540 445l380-60v270l-380 44z" fill="#e0cfac" stroke="#193a3e" stroke-width="5"/><path d="M430 640l85 55v58l-85-53zM790 646l85-12v58l-85 12z" fill="#8b5b39" stroke="#193a3e" stroke-width="5"/><g font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#193a3e"><text x="80" y="343">WALLS?</text><text x="80" y="535">BRACING?</text><text x="80" y="712">SKIDS?</text></g><g fill="none" stroke="#a57045" stroke-width="5"><path d="M268 331h85M292 523h57M255 700h153"/></g><rect y="796" width="1200" height="104" fill="#193a3e"/><text x="65" y="860" font-family="Arial,sans-serif" font-size="38" fill="#f5f1e7">Check every supporting component.</text></svg>