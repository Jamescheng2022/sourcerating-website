<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d"><title id="t">Which mass does the document describe?</title><desc id="d">Three conceptual components are distinguished: cargo, packing and securing material, and the container. No actual mass or approved weighing procedure is depicted.</desc><rect width="1200" height="900" fill="#edf1ec"/><text x="65" y="100" font-family="Arial,sans-serif" font-size="30" letter-spacing="4" fill="#93633f">SOURCE RATING / FIELD NOTES</text><text x="65" y="198" font-family="Georgia,serif" font-size="64" fill="#193a3e">What is inside the total?</text><g font-family="Arial,sans-serif" font-size="45" font-weight="700" fill="#193a3e"><text x="70" y="330">CARGO</text><text x="70" y="500">PACKING + SECURING</text><text x="70" y="670">THE CONTAINER</text></g><g fill="#c2d3ca" stroke="#193a3e" stroke-width="5"><rect x="810" y="264" width="170" height="97"/><path d="M750 525h300v24H750zM780 450h240v45H780z"/><rect x="725" y="595" width="325" height="125" rx="4"/><path d="M765 612v90m42-90v90m42-90v90m42-90v90m42-90v90m42-90v90m42-90v90"/></g><g font-family="Arial,sans-serif" font-size="53" fill="#a8744f"><text x="875" y="420">+</text><text x="875" y="587">+</text></g><rect y="796" width="1200" height="104" fill="#193a3e"/><text x="65" y="860" font-family="Arial,sans-serif" font-size="38" fill="#edf1ec">Cargo mass is not the whole packed unit.</text></svg>