<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d"><title id="t">A certificate needs a connection to the operation</title><desc id="d">Three linked questions: whose name is certified, what activity is covered, and where the order is made. This is a conceptual diagram, not a certificate.</desc><rect width="1200" height="900" fill="#f5f1e7"/><text x="70" y="100" font-family="Arial,sans-serif" font-size="30" letter-spacing="4" fill="#8c5a40">SOURCE RATING / FIELD NOTES</text><text x="70" y="198" font-family="Georgia,serif" font-size="64" fill="#193a3e">Which operation is covered?</text><g font-family="Arial,sans-serif" fill="#193a3e"><text x="80" y="320" font-size="48" font-weight="700">THE NAME</text><text x="80" y="494" font-size="48" font-weight="700">THE SCOPE</text><text x="80" y="668" font-size="48" font-weight="700">THE SITE</text></g><g stroke="#193a3e" stroke-width="5" fill="#c9d5ce"><rect x="680" y="252" width="330" height="112" rx="8"/><path d="M715 285h180m-180 30h250"/><rect x="680" y="426" width="330" height="112" rx="8"/><path d="M715 459h80m40 0h140m-260 32h260"/><path d="M677 705V600l100 48v-48l110 48v-48l128 55v50z"/></g><g stroke="#b2764f" stroke-width="7" fill="none"><path d="M845 376v35m-12-12 12 12 12-12M845 550v35m-12-12 12 12 12-12"/></g><rect y="796" width="1200" height="104" fill="#193a3e"/><text x="70" y="860" font-family="Arial,sans-serif" font-size="38" fill="#f5f1e7">Authentic is not the same as relevant.</text></svg>