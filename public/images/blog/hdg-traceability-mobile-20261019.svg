<text x="45" y="104" font-family="Arial,Helvetica,sans-serif" font-size="21" letter-spacing="4" font-weight="700" fill="#a66a3c">SOURCE RATING  /  FIELD NOTES</text>
<text x="45" y="166" font-family="Georgia,Times New Roman,serif" font-size="56" fill="#1a333c">From reading</text>
<text x="45" y="222" font-family="Georgia,Times New Roman,serif" font-size="56" fill="#1a333c">to real steel</text>
<text x="46" y="266" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#61757a">A certificate is not a shipment ID.</text>
