<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1125" width="900" height="1125" role="img" aria-labelledby="title desc"><title id="title">Inspect the defined lot, not an imagined uniform shipment</title><desc id="desc">Illustration separating varied manufacturing revisions in a defined shipment from the specific sample and characteristics examined.</desc><rect width="900" height="1125" fill="#f6f2ea"/><path d="M65 70H835" stroke="#b8b4a7" stroke-width="2"/><text x="65" y="118" fill="#a16842" font-size="29" font-family="Arial,Helvetica,sans-serif" font-weight="700" letter-spacing="4">SOURCE RATING / FIELD NOTES</text>
<text x="65" y="207" fill="#17343b" font-size="60" font-family="Georgia,serif">Define the lot.</text><text x="65" y="277" fill="#17343b" font-size="60" font-family="Georgia,serif">Then define the test.</text>
<text x="65" y="346" fill="#607277" font-size="36" font-family="Arial,Helvetica,sans-serif">A report can only speak for its scope.</text>
<rect x="63" y="395" width="775" height="266" rx="9" fill="#e2e7de" stroke="#82948c" stroke-width="3"/>
<text x="94" y="450" fill="#17343b" font-size="37" font-weight="700" font-family="Arial,Helvetica,sans-serif">SHIPMENT / LOT DEFINITION</text>
