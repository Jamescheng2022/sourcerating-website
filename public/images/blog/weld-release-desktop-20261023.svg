<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" width="1200" height="690" role="img"><title>A photo is not a release packet.</title><desc>Original SourceRating editorial illustration; not evidence of any real project, weld or inspection result.</desc><rect x="0" y="0" width="1200" height="690" rx="0" fill="#24443A"/><text x="42" y="48" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#D2E0D4">SOURCERATING / EVIDENCE PLATE 03</text><text x="42" y="108" font-family="Arial,Helvetica,sans-serif" font-size="41" font-weight="700" fill="#F9F7EF">A photo is not a release packet.</text><text x="42" y="151" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" fill="#CFDBD1">Inspection and authorization cannot be inferred.</text><rect x="48" y="231" width="274" height="306" rx="12" fill="#FAF9F3"/><text x="70" y="282" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#BE7546">01</text><text x="70" y="343" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#203D33">VISIBLE</text><path d="M69 368 L300 368" stroke="#B6C8BA" stroke-width="2" stroke-linecap="round"/><text x="70" y="410" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#203D33">What can be seen?</text><text x="70" y="456" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#397368">Surface appearance</text><rect x="337" y="231" width="274" height="306" rx="12" fill="#FAF9F3"/><text x="359" y="282" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#BE7546">02</text><text x="359" y="343" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#203D33">IDENTIFIED</text><path d="M358 368 L589 368" stroke="#B6C8BA" stroke-width="2" stroke-linecap="round"/><text x="359" y="410" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#203D33">Which joint?</text><te