<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d"><title id="t">The shipment, the sample and the decision</title><desc id="d">An original conceptual illustration separates a full lot from a selected inspection sample and a conditional lot-acceptance decision. No sample size or real result is prescribed.</desc><rect width="1200" height="900" fill="#f5f1e7"/><path d="M72 70H1128" stroke="#b8b8ac" stroke-width="2"/><text x="74" y="120" font-family="Arial,Helvetica,sans-serif" font-size="30" letter-spacing="5" fill="#8b5739">SOURCE RATING / FIELD NOTES</text><text x="74" y="214" font-family="Georgia,serif" font-size="66" fill="#193a3e">What does PASS mean?</text><text x="74" y="326" font-family="Arial,Helvetica,sans-serif" font-size="52" font-weight="700" fill="#193a3e">THE SHIPMENT</text><g fill="#acbdb6" stroke="#193a3e" stroke-width="3"><rect x="660" y="267" width="70" height="60"/><rect x="740" y="267" width="70" height="60"/><rect x="820" y="267" width="70" height="60"/><rect x="900" y="267" width="70" height="60"/><rect x="980" y="267" width="70" height="60"/><rect x="660" y="337" width="70" height="60"/><rect x="740" y="337" width="70" height="60"/><rect x="820" y="337" width="70" height="60"/><rect x="900" y="337" width="70" height="60"/><rect x="980" y="337" width="70" height="60"/></g><path d="M72 433H1128" stroke="#c5c5b7" stroke-width="2"/><text x="74" y="529" font-family="Arial,Helvetica,sans-serif" font-size="52" font-weight="700" fill="#193a3e">THE SAMPLE</text><g fill="#c88b58" stroke="#193a3e" stroke-width="3"><rect x="740" y="479" width="85" height="72"/><rect x="845" y="479" width="85" height="72"/></g><path d="M836 415V461M824 445L836 461L848 445" fill="none" stroke="#9d6747" stroke-width="5"/><path d="M72 590H1128" stroke="#c5c5b7" stroke-width="2"/><text x="74" y="694" font-family="Arial,Helvetica,sans-serif" font-size="52" font-weight="700" fill="#193a3e">THE DECISION</text><rect x="670" y="633" width="380" height="97" rx="4" fill="#193a3e"/><text x="860" y="696" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="48" fill="#f5f1e7">LOT RELEASE</text><rect x="0" y="804" width="1200" height="96" fill="#193a3e"/><text x="72" y="865" font-family="Arial,Helvetica,sans-serif" font-size="37" fill="#f5f1e7">An agreed rule. Not a zero-defect promise.</text></svg>