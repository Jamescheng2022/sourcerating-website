<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d"><title id="t">Test time is not a service-life clock</title><desc id="d">A laboratory chamber and an outdoor coated assembly are shown as different environments, with no numerical time conversion.</desc><rect width="1200" height="900" fill="#f4f0e6"/><text x="65" y="100" font-family="Arial,sans-serif" font-size="30" letter-spacing="4" fill="#8c5a40">SOURCE RATING / FIELD NOTES</text><text x="65" y="200" font-family="Georgia,serif" font-size="64" fill="#193a3e">Two different environments</text><rect x="100" y="310" width="410" height="300" rx="10" fill="#d7e1dc" stroke="#193a3e" stroke-width="6"/><path d="M150 360h310M180 387l-15 25m95-25-15 25m95-25-15 25m95-25-15 25M170 530h270" fill="none" stroke="#657f82" stroke-width="10"/><rect x="215" y="460" width="180" height="70" fill="#a77b56"/><g stroke="#193a3e" stroke-width="8" fill="none"><path d="M700 590V410h300v180M700 470h300M830 410v180"/></g><circle cx="955" cy="335" r="43" fill="#c3914c"/><path d="M700 632h310" stroke="#71928b" stroke-width="12"/><text x="305" y="704" text-anchor="middle" font-family="Arial,sans-serif" font-size="43" font-weight="700" fill="#193a3e">CHAMBER HOURS</text><text x="850" y="704" text-anchor="middle" font-family="Arial,sans-serif" font-size="43" font-weight="700" fill="#193a3e">SITE CONDITIONS</text><rect y="796" width="1200" height="104" fill="#193a3e"/><text x="65" y="860" font-family="Arial,sans-serif" font-size="38" fill="#f4f0e6">No automatic conversion to years outdoors.</text></svg>