<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d"><title id="t">Put both declarations on a comparable basis</title><desc id="d">Two conceptual declarations are checked against three questions: function, unit and boundary. No actual emissions data or product ranking is shown.</desc><rect width="1200" height="900" fill="#eef2ed"/><text x="65" y="100" font-family="Arial,sans-serif" font-size="30" letter-spacing="4" fill="#93623e">SOURCE RATING / FIELD NOTES</text><text x="65" y="198" font-family="Georgia,serif" font-size="64" fill="#193a3e">Before comparing the number</text><g fill="#fffdf6" stroke="#193a3e" stroke-width="5"><rect x="90" y="295" width="280" height="330" rx="5"/><rect x="830" y="295" width="280" height="330" rx="5"/></g><g font-family="Georgia,serif" font-size="65" fill="#193a3e"><text x="230" y="385" text-anchor="middle">EPD A</text><text x="970" y="385" text-anchor="middle">EPD B</text></g><g font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#193a3e"><text x="600" y="450" text-anchor="middle">FUNCTION?</text><text x="600" y="530" text-anchor="middle">UNIT?</text><text x="600" y="610" text-anchor="middle">BOUNDARY?</text></g><g stroke="#9aaf9e" stroke-width="10"><path d="M130 443h200m-200 65h200m-200 65h150M870 443h200m-200 65h200m-200 65h150"/></g><rect y="796" width="1200" height="104" fill="#193a3e"/><text x="65" y="860" font-family="Arial,sans-serif" font-size="38" fill="#eef2ed">A lower figure needs a comparable basis.</text></svg>