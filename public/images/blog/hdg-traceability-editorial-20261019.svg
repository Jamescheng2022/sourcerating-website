<rect x="0" y="826" width="1600" height="74" fill="#17323c"/>
<text x="92" y="874" font-family="Arial,Helvetica,sans-serif" font-size="21" letter-spacing="1" fill="#f7f5ef">Follow the identity of the steel—not just the paperwork.</text>
<text x="1510" y="874" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#b8c6c4">Illustrative diagram · Not an inspection record</text>
