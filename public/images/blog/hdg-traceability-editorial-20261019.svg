<path d="M1225 728h214" stroke="#ae7749" stroke-width="12" stroke-linecap="round"/>
<text x="1242" y="770" font-size="20" fill="#647677">MARK / QTY / RELEASE</text>
</g>
<g fill="none" stroke="#aa7448" stroke-width="8" stroke-linejoin="round" stroke-linecap="round">
<path d="M343 610h96m-17-17 17 17-17 17"/>
