<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc">
<title id="title">From reading to real steel: four links in the galvanized-steel evidence chain</title>
<desc id="desc">Editorial diagram connecting approved drawing, galvanizing lot, representative coating measurements, and packing list. This is an illustration, not a real test result or shipment record.</desc>
<defs>
 <pattern id="grain" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="3" r="0.8" fill="#17313a" opacity=".07"/></pattern>
 <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d2ddd9"/><stop offset=".55" stop-color="#7e969a"/><stop offset="1" stop-color="#425a61"/></linearGradient>
</defs>
<rect width="1600" height="900" fill="#f7f5ef"/><rect width="1600" height="900" fill="url(#grain)" />
<path d="M90 78H1510" stroke="#b4b5ad" stroke-width="2"/>
<text x="92" y="125" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" letter-spacing="6" fill="#a46739">SOURCE RATING  /  FIELD NOTES</text>
<text x="92" y="228" font-family="Georgia,Times New Roman,serif" font-size="80" fill="#183039">From reading to real steel</text>
<text x="94" y="279" font-family="Arial,Helvetica,sans-serif" font-size="31" fill="#506168">A certificate is not a shipment ID.</text>
<path d="M92 338H1508" stroke="#a8b5af" stroke-width="1.6"/>
<g font-family="Arial,Helvetica,sans-serif">
<!-- drawing panel -->
<text x="100" y="406" font-size="21" letter-spacing="4" font-weight="700" fill="#a46739">01  DEFINE</text>
<text x="100" y="444" font-size="30" fill="#183039" font-weight="700">Approved drawing</text>
<text x="100" y="482" font-size="22" fill="#566a6f">Revision and piece marks</text>
<rect x="110" y="532" width="210" height="164" rx="5" fill="#fff" stroke="#98aaa8" stroke-width="4"/>
<path d="M136 573H296M136 590H246" stroke="#c3cfca" stroke-width="7"/>
<path d="M139 647l45-34 52 21 45-29" stroke="#41616b" stroke-width="7" stroke-linecap="round" fill="none"/>
<circle cx="139" cy="647" r="8" fill="#b47746"/><circle cx="184" cy="613" r="8" fill="#b47746"/><circle cx="236" cy="634" r="8" fill="#b47746"/><circle cx="281" cy="605" r="8" fill="#b47746"/>
<text x="138" y="683" font-size="19" fill="#6a7a7b">DWG / REV / MARK</text>
