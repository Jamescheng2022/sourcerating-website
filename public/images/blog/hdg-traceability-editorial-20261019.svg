<path d="M930 704v29m0 0h25" fill="none" stroke="#263f48" stroke-width="10" stroke-linecap="round"/>
<path d="M1011 684q49 18 58-26" fill="none" stroke="#5b747b" stroke-width="8" stroke-linecap="round"/>
