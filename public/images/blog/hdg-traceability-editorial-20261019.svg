<circle cx="586" cy="661" r="21" fill="#d8e0dc"/><path d="M572 661h28M586 647v28" stroke="#667a7a" stroke-width="5"/>
<text x="532" y="735" font-size="21" fill="#647677">LOT ≠ ORDER</text>
<!-- sample panel -->
<text x="841" y="406" font-size="21" letter-spacing="4" font-weight="700" fill="#a46739">03  MEASURE</text>
<text x="841" y="444" font-size="30" fill="#183039" font-weight="700">Inspection sample</text>
<text x="841" y="482" font-size="22" fill="#566a6f">Method, readings and link</text>
