<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="805" viewBox="0 0 1200 805" role="img" aria-labelledby="title desc">
<title id="title">Evidence chain for tested specimen, product revision and intended end use</title><desc id="desc">Conceptual editorial depiction of a report, a physical panel sample and an installed arrangement. These are not actual test records or approvals. It emphasizes matching product revision and end-use scope to the report.</desc>
<defs><linearGradient id="steel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#AFC2C8"/><stop offset=".31" stop-color="#F4F6F4"/><stop offset=".67" stop-color="#8298A0"/><stop offset="1" stop-color="#536A74"/></linearGradient>
<linearGradient id="darkmetal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#334953"/><stop offset=".5" stop-color="#152A33"/><stop offset="1" stop-color="#445862"/></linearGradient>
<linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E9D7BC"/><stop offset="1" stop-color="#B8A68D"/></linearGradient>
<linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E5EAE7"/></linearGradient>
<pattern id="fiber" width="14" height="16" patternUnits="userSpaceOnUse"><path d="M-2 16L16-2 M6 20L20 6" stroke="#9F907D" stroke-width="1" opacity=".3"/></pattern>
<pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse"><path d="M 64 0 L 0 0 0 64" fill="none" stroke="#70838B" stroke-width="1" opacity=".10"/></pattern>
<filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="13" stdDeviation="17" flood-color="#12262D" flood-opacity=".14"/></filter>
</defs>
<rect x="0" y="0" width="1200" height="805" rx="0" fill="#F5F3EE" stroke="none" stroke-width="1"/><rect x="0" y="0" width="1200" height="805" rx="0" fill="url(#grid)" stroke="none" stroke-width="1"/>
<path d="M 0 0 H 1200 V 11 H 0Z" fill="#B0744D"/>
<text x="75" y="72" fill="#B0744D" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" letter-spacing="3">FIGURE 03 / DECISION FILE</text><text x="75" y="134" fill="#172B35" font-family="Arial,Helvetica,sans-serif" font-size="44" font-weight="700" >The report is a starting point.</text><text x="75" y="179" fill="#586974" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" >The approved scope must reach the purchased and installed construction.</text><rect x="50" y="215" width="1100" height="465" rx="24" fill="#E2E5E1" stroke="#CBD2CC" stroke-width="2"/><g transform="translate(125 258) scale(0.94)"><g filter="url(#shadow)"><rect x="0" y="0" width="255" height="315" rx="12" fill="url(#paper)" stroke="#B4C4C3" stroke-width="2"/></g><rect x="25" y="29" width="205" height="11" rx="5" fill="#B0744D" stroke="none" stroke-width="1"/><text x="25" y="83" fill="#172B35" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" >TEST SCOPE</text><line x1="25" y1="107" x2="227" y2="107" stroke="#B2C4C4" stroke-width="3" /><rect x="25" y="136" width="120" height="7" rx="3" fill="#C5CFCC" stroke="none" stroke-width="1"/><rect x="25" y="167" width="186" height="7" rx="3" fill="#C5CFCC" stroke="none" stroke-width="1"/><rect x="25" y="198" width="120" height="7" rx="3" fill="#C5CFCC" stroke="none" stroke-width="1"/><rect x="25" y="229" width="186" height="7" rx="3" fill="#C5CFCC" stroke="none" stroke-width="1"/><rect x="25" y="260" width="120" height="7" rx="3" fill="#C5CFCC" stroke="none" stroke-width="1"/><rect x="25" y="275" width="128" height="9" rx="4" fill="#7E9797" stroke="none" stroke-width="1"/></g><g transform="translate(475 266) scale(0.98)"><ellipse cx="155" cy="270" rx="160" ry="27" fill="#798887" opacity=".19"/><polygon points="45,70 276,35 306,230 76,264" fill="url(#steel)" stroke="#69818B" stroke-width="3"/><polygon points="58,87 263,57 283,214 84,242" fill="url(#core)" stroke="#938C7E" stroke-width="3"/><polygon points="58,87 263,57 271,80 65,112" fill="#D9E1DC"/><polygon points="263,57 276,35 306,230 283,214" fill="#48646E"/></g><g transform="translate(834 273) scale(0.88)"><ellipse cx="148" cy="271" rx="160" ry="24" fill="#7C8D8D" opacity=".2"/><rect x="16" y="65" width="296" height="207" rx="4" fill="url(#steel)" stroke="#65808A" stroke-width="4"/><line x1="19" y1="66" x2="19" y2="270" stroke="#58717A" stroke-width="5" /><line x1="117" y1="66" x2="117" y2="270" stroke="#58717A" stroke-width="5" /><line x1="215" y1="66" x2="215" y2="270" stroke="#58717A" stroke-width="5" /><rect x="30" y="80" width="260" height="11" rx="2" fill="#F2F4EF" stroke="none" stroke-width="1"/><rect x="30" y="240" width="260" height="12" rx="2" fill="#899FA4" stroke="none" stroke-width="1"/><rect x="0" y="252" width="324" height="21" rx="2" fill="url(#darkmetal)" stroke="none" stroke-width="1"/></g><text x="120" y="660" fill="#172B35" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" >TESTED SPECIMEN</text><text x="466" y="660" fill="#172B35" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" >PRODUCT REVISION</text><text x="832" y="660" fill="#172B35" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" >INTENDED END USE</text><line x1="390" y1="485" x2="472" y2="485" stroke="#B0744D" stroke-width="4" stroke-dasharray="9 7"/><line x1="791" y1="485" x2="831" y2="485" stroke="#B0744D" stroke-width="4" stroke-dasharray="9 7"/><text x="69" y="736" fill="#172B35" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="500" >The acceptance route belongs to the project, not the supplier catalog.</text>
</svg>