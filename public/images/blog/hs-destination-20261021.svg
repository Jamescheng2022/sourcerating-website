<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d"><title id="t">An international level and a national decision</title><desc id="d">Six conceptual boxes represent the harmonized six-digit level. Separate boxes indicate national additions of varying length. No actual code or rate is shown.</desc><rect width="1200" height="900" fill="#f4f0e7"/><text x="65" y="100" font-family="Arial,sans-serif" font-size="30" letter-spacing="4" fill="#8d5c3f">SOURCE RATING / FIELD NOTES</text><text x="65" y="198" font-family="Georgia,serif" font-size="64" fill="#193a3e">The same code everywhere?</text><text x="70" y="334" font-family="Arial,sans-serif" font-size="43" font-weight="700" fill="#193a3e">HARMONIZED SIX-DIGIT LEVEL</text><g fill="#c1d3ca" stroke="#193a3e" stroke-width="4"><rect x="80" y="380" width="145" height="100"/><rect x="240" y="380" width="145" height="100"/><rect x="400" y="380" width="145" height="100"/><rect x="560" y="380" width="145" height="100"/><rect x="720" y="380" width="145" height="100"/><rect x="880" y="380" width="145" height="100"/></g><text x="70" y="588" font-family="Arial,sans-serif" font-size="43" font-weight="700" fill="#193a3e">DESTINATION-SPECIFIC ADDITIONS</text><path d="M90 625h910v87H90z" fill="#d9bf98" stroke="#93633f" stroke-width="4"/><text x="545" y="683" text-anchor="middle" font-family="Arial,sans-serif" font-size="36" fill="#193a3e">Check the national schedule</text><rect y="796" width="1200" height="104" fill="#193a3e"/><text x="65" y="860" font-family="Arial,sans-serif" font-size="38" fill="#f4f0e7">A supplier's number is not a final ruling.</text></svg>