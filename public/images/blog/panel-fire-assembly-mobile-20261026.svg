<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1310" viewBox="0 0 720 1310" role="img" aria-labelledby="title desc">
<title id="title">Conceptual sandwich panel configuration elements</title><desc id="desc">Original symbolic, not to scale cross-section of a sandwich construction with front/back facings, a core, a joint, a through-fixing and metal support. Actual assemblies vary and report scope must be checked.</desc>
<defs><linearGradient id="steel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#AFC2C8"/><stop offset=".31" stop-color="#F4F6F4"/><stop offset=".67" stop-color="#8298A0"/><stop offset="1" stop-color="#536A74"/></linearGradient>
<linearGradient id="darkmetal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#334953"/><stop offset=".5" stop-color="#152A33"/><stop offset="1" stop-color="#445862"/></linearGradient>
<linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E9D7BC"/><stop offset="1" stop-color="#B8A68D"/></linearGradient>
<linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E5EAE7"/></linearGradient>
<pattern id="fiber" width="14" height="16" patternUnits="userSpaceOnUse"><path d="M-2 16L16-2 M6 20L20 6" stroke="#9F907D" stroke-width="1" opacity=".3"/></pattern>
<pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse"><path d="M 64 0 L 0 0 0 64" fill="none" stroke="#70838B" stroke-width="1" opacity=".10"/></pattern>
<filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="13" stdDeviation="17" flood-color="#12262D" flood-opacity=".14"/></filter>
</defs>
<rect x="0" y="0" width="720" height="1310" rx="0" fill="#F5F3EE" stroke="none" stroke-width="1"/><rect x="0" y="0" width="720" height="1310" rx="0" fill="url(#grid)" stroke="none" stroke-width="1"/>
<path d="M 0 0 H 720 V 11 H 0Z" fill="#B0744D"/>
<text x="52" y="69" fill="#B0744D" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" letter-spacing="3">FIGURE 02 / CONSTRUCTION MATTERS</text><text x="52" y="131" fill="#172B35" font-family="Arial,Helvetica,sans-serif" font-size="37" font-weight="700" >What was actually tested?</text><text x="52" y="176" fill="#586974" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" >Matching a product name does not prove matching installation.</text><rect x="40" y="245" width="640" height="470" rx="22" fill="#E7E9E5" stroke="#D1DAD6" stroke-width="2"/><g transform="translate(40 250) scale(0.86)"><ellipse cx="400" cy="440" rx="367" ry="36" fill="#7B8988" opacity=".20"/><rect x="48" y="50" width="680" height="52" rx="3" fill="url(#steel)" stroke="#5B7780" stroke-width="3"/><rect x="48" y="101" width="680" height="255" rx="0" fill="url(#core)" stroke="#BAA891" stroke-width="2"/><rect x="48" y="101" width="680" height="255" rx="0" fill="url(#fiber)" stroke="none" stroke-width="1"/><rect x="48" y="357" width="680" height="24" rx="1" fill="url(#steel)" stroke="#5B7780" stroke-width="3"/><rect x="444" y="42" width="15" height="341" rx="3" fill="#334C55" stroke="none" stroke-width="1"/><rect x="463" y="103" width="7" height="258" rx="0" fill="#D4B07C" stroke="none" stroke-width="1"/><line x1="470" y1="103" x2="470" y2="357" stroke="#253A43" stroke-width="3" /><rect x="255" y="382" width="350" height="35" rx="4" fill="url(#darkmetal)" stroke="none" stroke-width="1"/><rect x="280" y="417" width="26" height="54" rx="2" fill="url(#darkmetal)" stroke="none" stroke-width="1"/><rect x="564" y="417" width="26" height="54" rx="2" fill="url(#darkmetal)" stroke="none" stroke-width="1"/><rect x="306" y="24" width="16" height="395" rx="4" fill="url(#steel)" stroke="#72898E" stroke-width="1"/><ellipse cx="314" cy="30" rx="38" ry="14" fill="url(#steel)" stroke="#526B74" stroke-width="3"/><circle cx="314" cy="29" r="9" fill="#506873"/></g><rect x="56" y="738" width="59" height="59" rx="11" fill="#B0744D" stroke="none" stroke-width="1"/><text x="65" y="776" fill="#FFF" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" >01</text><text x="134" y="776" fill="#172B35" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="600" >Facing and finish</text><line x1="134" y1="802" x2="660" y2="802" stroke="#CBD4D0" stroke-width="1" /><rect x="56" y="829" width="59" height="59" rx="11" fill="#B0744D" stroke="none" stroke-width="1"/><text x="65" y="867" fill="#FFF" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" >02</text><text x="134" y="867" fill="#172B35" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="600" >Core and density</text><line x1="134" y1="893" x2="660" y2="893" stroke="#CBD4D0" stroke-width="1" /><rect x="56" y="920" width="59" height="59" rx="11" fill="#B0744D" stroke="none" stroke-width="1"/><text x="65" y="958" fill="#FFF" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" >03</text><text x="134" y="958" fill="#172B35" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="600" >Joints and edges</text><line x1="134" y1="984" x2="660" y2="984" stroke="#CBD4D0" stroke-width="1" /><rect x="56" y="1011" width="59" height="59" rx="11" fill="#B0744D" stroke="none" stroke-width="1"/><text x="65" y="1049" fill="#FFF" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" >04</text><text x="134" y="1049" fill="#172B35" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="600" >Fixing and support</text><line x1="134" y1="1075" x2="660" y2="1075" stroke="#CBD4D0" stroke-width="1" /><rect x="56" y="1102" width="59" height="59" rx="11" fill="#B0744D" stroke="none" stroke-width="1"/><text x="65" y="1140" fill="#FFF" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" >05</text><text x="134" y="1140" fill="#172B35" font-family="Arial,Helvetica,sans-se