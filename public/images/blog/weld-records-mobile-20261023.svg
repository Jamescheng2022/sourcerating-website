<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 1220" width="700" height="1220" role="img"><title>Three records. Three jobs.</title><desc>Original SourceRating editorial illustration; not evidence of any real project, weld or inspection result.</desc><rect x="0" y="0" width="700" height="1220" rx="0" fill="#F4F1E8"/><text x="42" y="48" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#397368">SOURCERATING / EVIDENCE PLATE 02</text><text x="42" y="108" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#203D33">Three records. Three jobs.</text><text x="42" y="151" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#60746A">A procedure is not an inspection result.</text><rect x="39" y="197" width="624" height="278" rx="12" fill="#FFFFFF"/><rect x="39" y="197" width="624" height="10" rx="0" fill="#BE7546"/><text x="65" y="251" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#397368">WPS / METHOD</text><text x="65" y="308" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" fill="#203D33">PROCEDURE</text><path d="M65 340 L637 340" stroke="#D1DAD1" stroke-width="2" stroke-linecap="round"/><text x="65" y="391" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#203D33">What process is agreed?</text><text x="65" y="445" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#60746A">Parameters and qualification basis</text><rect x="39" y="503" width="624" height="278" rx="12" fill="#FFFFFF"/><rect x="39" y="503" width="624" height="10" rx="0" fill="#397368"/><text x="65" y="557" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#397368">WELDER</text><text x="65" y="614" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" fill="#203D33">PERSONNEL</text><path d="M65 646 L637 646" stroke="#D1DAD1" stroke-width="2" stroke-linecap="round"/><text x="65" y="697" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#203D33">Who may perform it?</text><text x="65" y="751" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#60746A">Applicable qualification evidence</text><rect x="39" y="809" width="624" height="278" rx="12" fill="#FFFFFF"/><rect x="39" y="809" width="624" height="10" rx="0" fill="#203D33"/><text x="65" y="863" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#397368">REPORT</text><text x="65" y="920" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" fill="#203D33">EXAMINATION</text><path d="M65 952 L637 952" stroke="#D1DAD1" stroke-width="2" stroke-linecap="round"/><text x="65" y="1003" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#203D33">What was checked?</text><text x="65" y="1057" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#60746A">Named weld, method, outcome</text><text x="42" y="1191" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#60746A">ORIGINAL EXPLANATORY ART  /  NOT A PROJECT RECORD</text></svg>