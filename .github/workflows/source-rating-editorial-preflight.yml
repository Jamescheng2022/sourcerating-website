name: SourceRating editorial preflight

on:
  pull_request:
    branches: [main]
    paths:
      - '.agents/skills/sourcerating-publish/**'
      - '.github/workflows/source-rating-editorial-preflight.yml'
      - 'docs/editorial/**'
      - 'scripts/check-editorial-publication.mjs'
      - 'src/content/blog/**'
      - 'src/data/blog.ts'
      - 'src/app/blog/**'
      - 'src/components/shared/ArticleBody.tsx'
      - 'public/images/blog/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Article registry, images and Next build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Deterministic publication preflight for all registered articles
        run: npm run check:publication
      - name: Block PRs with too few or unverified inline article images
        run: npm run check:publication:changed
      - name: Regression-test stale publication detection
        run: npm run test:publication
      - name: Preserve pinned legacy blog and cover regressions
        run: node scripts/verify-blog-cover.mjs
      - name: Build Next.js website
        run: npm run build
